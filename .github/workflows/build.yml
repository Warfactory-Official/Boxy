name: Native NeoForge Build

on:
  push:
    branches: ["main", "1.21.1"]
  pull_request:
    branches: ["main", "1.21.1"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Await upstream snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # repo:workflow:branch. Upstream head run must pass before -SNAPSHOT deps resolve; 3 min grace for it to appear.
          for up in voxy:build-release.yml:multiversion; do
            IFS=: read -r repo wf branch <<<"$up"
            head=$(gh api "repos/Warfactory-Official/$repo/commits/$branch" -q .sha)
            status=; conclusion=; sha=; url=
            for i in $(seq 1 160); do
              IFS=$'\t' read -r sha status conclusion url < <(gh run list -R "Warfactory-Official/$repo" -w "$wf" -b "$branch" -L 1 \
                --json headSha,status,conclusion,url -q '.[0] | [.headSha, .status, .conclusion, .url] | @tsv') || true
              if [ "$status" = completed ] && { [ "$sha" = "$head" ] || [ "$i" -gt 12 ]; }; then break; fi
              sleep 15
            done
            [ "$status" = completed ] || { echo "::error::$repo $wf not finished after 40 min: $url"; exit 1; }
            [ "$conclusion" = success ] || { echo "::error::$repo $wf $conclusion at ${sha::7}: $url"; exit 1; }
            echo "$repo $wf ok at ${sha::7}"
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Obtain Voxy 1.21.1 NeoForge dependency
        run: |
          set -euo pipefail
          mkdir -p libs
          target='libs/voxy-0.2.17-beta+1.21.1-neoforge.jar'
          url='https://github.com/Warfactory-Official/voxy/releases/download/latest/1.21.1-neoforge-voxy-0.2.17-beta%2B1.21.1-neoforge.jar'
          curl --fail --location --proto '=https' --proto-redir '=https' --output "$target" "$url"
      - name: Build and verify addon
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain
      - name: Publish rolling latest release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/boxy-*.jar \
            --title "Latest Boxy build (${GITHUB_SHA::7})" \
            --notes "Automated Boxy NeoForge 1.21.1 build of ${GITHUB_SHA}. Install the single Boxy jar; Voxy is downloaded separately at client startup." \
            --latest=false

      - name: Publish snapshot
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          WARFACTORY_MAVEN_USER: ${{ secrets.WARFACTORY_MAVEN_USER }}
          WARFACTORY_MAVEN_TOKEN: ${{ secrets.WARFACTORY_MAVEN_TOKEN }}
        run: ./gradlew publish --no-daemon --stacktrace
