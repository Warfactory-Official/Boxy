name: Native NeoForge Build

on:
  push:
    branches: ["main", "1.21.1"]
  pull_request:
    branches: ["main", "1.21.1"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Obtain Voxy 1.21.1 NeoForge dependency
        run: |
          set -euo pipefail
          mkdir -p libs
          target='libs/voxy-0.2.15-beta+1.21.1-neoforge.jar'
          url='https://github.com/Warfactory-Official/voxy/releases/download/latest/1.21.1-neoforge-voxy-0.2.15-beta%2B1.21.1-neoforge.jar'
          curl --fail --location --proto '=https' --proto-redir '=https' --output "$target" "$url"
      - name: Build and verify addon
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon --console=plain
      - name: Upload Boxy only
        uses: actions/upload-artifact@v4
        with:
          name: boxy-neoforge-1.21.1
          path: build/libs/boxy-*.jar
          if-no-files-found: error

      - name: Publish rolling latest release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/libs/boxy-*.jar \
            --title "Latest Boxy build (${GITHUB_SHA::7})" \
            --notes "Automated Boxy NeoForge 1.21.1 build of ${GITHUB_SHA}" \
            --latest=false
