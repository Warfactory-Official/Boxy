# Boxy — loads the Voxy (Fabric) LoD rendering mod on Forge 1.20.1.
modLoader="javafml" #mandatory
loaderVersion="${loader_version_range}" #mandatory
license="${mod_license}"
#issueTrackerURL="https://github.com/golem/Boxy/issues" #optional

[[mods]] #mandatory
modId="${mod_id}" #mandatory
version="${mod_version}" #mandatory
displayName="${mod_name}" #mandatory
logoFile="boxy_icon.png" #optional
authors="${mod_authors}" #optional
# Boxy has no server-side behaviour; it only loads a client rendering mod.
displayTest="IGNORE_ALL_VERSION"
description='''${mod_description}'''

# Forge itself.
[[dependencies.${mod_id}]]
    modId="forge" #mandatory
    mandatory=true #mandatory
    versionRange="${forge_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Voxy needs a Sodium-compatible renderer; on Forge 1.20.1 that is Embeddium.
# Boxy must load BEFORE embeddium so Voxy's sodium mixins see embeddium's classes.
[[dependencies.${mod_id}]]
    modId="embeddium"
    mandatory=true
    versionRange="[0.3,)"
    ordering="BEFORE"
    side="CLIENT"
