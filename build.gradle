plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'com.gradleup.shadow' version '8.3.0'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so your mod should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

configurations {
    // Libraries relocated into Boxy's jar (so the early mod-locator can use them). 'shade' extends
    // implementation so they are also on the compile + dev-runtime classpath.
    shade
    implementation.extendsFrom shade

    // Resolves the Sinytra Fabric-Mixin fork jar (org.sinytra:sponge-mixin) that embedMixinUpgrade
    // injects verbatim at the production jar's root as 'fabric-mixin.jar'. Deliberately NOT on the
    // compile/runtime classpath — it is bundled as a nested jar and never compiled against.
    fabricMixinJar
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    // Boxy's dev environment uses official (Mojmap) mappings — see gradle.properties. This is load-bearing:
    // Boxy writes its source in official names and ForgeGradle reobfuscates it official->SRG at build time.
    mappings channel: mapping_channel, version: mapping_version

    // Runs ProcessResources on IDE output before a dev run so it picks up generated resources (the staged
    // cmd/boxymod bundles). Boxy uses no dev-time access transformer — Voxy's access widener is converted to
    // an AT at load time by AccessWidenerToAt, not here.
    copyIdeResources = true

    runs {
        // applies to all the run configs below
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above
            workingDirectory project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // ForgeGradle automatically adds the Forge maven and Maven Central for you.

    // Modrinth's maven serves Embeddium (the Sodium fork for Forge 1.20.1), used compile-only for
    // the client-settings-page mixin.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    // Sinytra's maven hosts the upgraded runtime Mixin (org.sinytra:sponge-mixin) that Mixin
    // Transmogrifier swaps in so Voxy's iris.* constructor injects apply under shaders (§12). This is
    // the exact fork Sinytra Connector bundles — do NOT substitute stock net.fabricmc:sponge-mixin.
    maven { url = "https://maven.su5ed.dev/releases" }

    // tiny-remapper + mixin extension (the load-time Voxy remapper) live on Fabric's maven.
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    // Specify the version of Minecraft to use.
    // Any artifact can be supplied so long as it has a "userdev" classifier artifact and is a compatible patcher artifact.
    // The "userdev" classifier will be requested and setup by ForgeGradle.
    // If the group id is "net.minecraft" and the artifact id is one of ["client", "server", "joined"],
    // then special handling is done to allow a setup of a vanilla dependency without the use of an external repository.
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Voxy's NAMED (Mojmap) dev jar from ./libs. Compile-only: Boxy's own source (e.g. BoxyCommands,
    // the chunky mixin, the VSS client bridge) references Voxy's public API. At runtime the remapped SRG
    // Voxy jar that Boxy's locator produces provides these classes, so this must never be bundled.
    // NOT fg.deobf: the dev jar is already in Mojmap names, matching Boxy's official dev mappings.
    // Not on any public maven — build it from https://github.com/m3t4f1v3/voxy and drop it in libs/
    // (see README.md -> Dependencies). Expected Voxy version 0.2.14-alpha; the glob matches its dev-jar name.
    compileOnly fileTree(dir: 'libs', include: ['voxy-*-dev.jar'])

    // ASM (asm-tree / asm-commons) for the load-time remapper. Forge ships ASM on the boot layer,
    // so this is compile-only — never bundle it.
    compileOnly "org.ow2.asm:asm:9.6"
    compileOnly "org.ow2.asm:asm-tree:9.6"
    compileOnly "org.ow2.asm:asm-commons:9.6"

    // tiny-remapper performs the intermediary->SRG remap of the Voxy jar, including the mixin-aware
    // pass (MixinExtension) needed for Voxy's static-remapped mixins. It is SHADED (relocated) into
    // Boxy's jar so the early mod-locator can use it at runtime. The 'shade' config (below) extends
    // implementation, so it is on the compile + dev-runtime classpath and bundled into the jar.
    shade("net.fabricmc:tiny-remapper:0.10.3") { transitive = false }

    // MixinExtras for Boxy's injected Chunky mixin (@ModifyReturnValue). Provided by Forge at runtime.
    compileOnly "io.github.llamalad7:mixinextras-common:0.3.5"

    // Embeddium (Sodium fork for Forge 1.20.1), from Modrinth's maven. Boxy's client settings page
    // (BoxyConfigPage + MixinEmbeddiumOptionsGUI) compiles against Embeddium's options-GUI API
    // (me.jellysquid.mods.sodium.client.gui.*), exactly like Voxy's own config page. compileOnly ⇒ never
    // bundled; resolved at runtime against the user's installed Embeddium. We only call Embeddium's own
    // (un-obfuscated) API with official MC class types — never MC members through it — so the production
    // jar compiles fine against Boxy's Mojmap dev env, no fg.deobf needed (same rationale as the Voxy dev jar).
    compileOnly "maven.modrinth:embeddium:0.3.31+mc1.20.1"

    // The upgraded runtime Mixin — Sinytra's Fabric-Mixin fork. Mixin Transmogrifier hot-swaps Forge's
    // stock Mixin 0.8.5 for this at boot so Voxy's iris.* @Inject-into-constructor shader mixins apply
    // (§12). Resolved into the 'fabricMixinJar' configuration and injected verbatim at the production jar
    // root by embedMixinUpgrade as 'fabric-mixin.jar' — never compiled against, never on any classpath.
    // Pinned to the exact version Sinytra Connector ships; the shader path is tuned to this build.
    fabricMixinJar("org.sinytra:sponge-mixin:0.12.11+mixin.0.8.5") { transitive = false }

    // NB: no Flashback compile dependency. The LOD-in-replay compat mixin (MixinBoxyFlashbackRecorder) string-
    // targets com.moulberry.flashback.record.Recorder and reads its `metadata` field reflectively, so Boxy is
    // not coupled to a Flashback artifact. (The Modrinth flashback jars are Java-21 bytecode for the 1.21 line,
    // which won't compile under Boxy's --release 17 anyway.) Flashback is resolved purely at runtime.

    // Chunky (multiplatform) for the auto-ingest mixin targeting org.popcraft.chunky.platform.ForgeWorld.
    // compileOnly "maven.modrinth:chunky:1.3.146"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// The published artifact is the shaded jar (it bundles the relocated tiny-remapper). The thin 'jar'
// becomes an intermediate 'slim' artifact that shadowJar consumes.
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    manifest {
        attributes([
                // The service-layer jar's JPMS module name. Without this it defaults to the filename
                // ("boxy"), which collides with the standalone game-layer mod's module (named after its
                // mod id, "boxy") — JPMS then fails with "module X reads more than one module named boxy".
                // This name is internal plumbing only; the mod id / displayed name stays "boxy".
                'Automatic-Module-Name'   : 'boxyloader',
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// The /voxy command mod (com.golem.boxy.cmd) is injected into Voxy's jar at runtime, so it
// must NOT be a class of Boxy's own (service-layer) jar — bundle it as a nested jar instead, in dev
// (official) names. VoxyRemapper remaps it official->SRG and merges it into the remapped Voxy jar.
tasks.register('cmdJar', Jar) {
    archiveClassifier = 'cmd'
    // Classes injected into Voxy's jar at runtime: the /voxy command @Mod and the Chunky mixin.
    // (Classes only, not resources, to avoid a processResources <-> cmdJar cycle.)
    from(sourceSets.main.output.classesDirs) {
        include 'com/golem/boxy/cmd/**'
        include 'me/cortex/voxy/commonImpl/mixin/chunky/**'
    }
    destinationDirectory = layout.buildDirectory.dir('cmd')
}

// Reobfuscate the command jar official->SRG with ForgeGradle (it has the full MC classpath, so it
// resolves inherited members correctly — a runtime tiny-remapper pass cannot). VoxyRemapper then
// merges these already-SRG classes straight into Voxy's jar.
reobf {
    cmdJar { }
}
tasks.named('cmdJar') { finalizedBy 'reobfCmdJar' }

// Stage the reobf'd cmd jar under a non-archive extension so it ends up in Boxy's jar as a verbatim
// binary (shadow unzips/merges anything ending in .jar). VoxyRemapper reads it at runtime.
tasks.register('stageCmdJar', Copy) {
    dependsOn 'reobfCmdJar'
    from(tasks.cmdJar.archiveFile)
    into layout.buildDirectory.dir('generated-cmd/boxy')
    rename { 'voxy-cmd.libzip' }
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated-cmd'))
tasks.named('processResources') { dependsOn 'stageCmdJar' }

// ---- Standalone Boxy game-layer mod (the Voxy Server Side port) ----
// Unlike the cmd bundle (which is *merged into* Voxy's jar), this is a COMPLETE, self-contained mod jar
// — its own META-INF/mods.toml, its own boxy.mixins.json, and a MixinConfigs manifest attribute — that
// BoxyModLocator returns to Forge as a SECOND ModFile alongside the remapped Voxy jar. It depends on
// Voxy and calls into it at runtime; Voxy's jar is left pristine. Classes are compiled in dev (official)
// names and reobfuscated official->SRG by ForgeGradle, exactly like the cmd bundle.
tasks.register('boxyModJar', Jar) {
    archiveClassifier = 'boxymod'
    // Boxy's game-layer code (VSS engine + networking + mixins + @Mod("boxy")). Classes only here;
    // the mod's resources (mods.toml, mixin config, pack.mcmeta) are added from src/boxymod/resources
    // below so they are NOT seen by the main processResources (which owns the service-layer mods.toml).
    from(sourceSets.main.output.classesDirs) {
        include 'com/golem/boxy/vss/**'
    }
    from('src/boxymod/resources')
    manifest {
        // Forge 1.20.1 discovers a jar's mixin configs from this manifest attribute (mods.toml [[mixins]]
        // is unreliable — same reason VoxyRemapper writes it for Voxy).
        attributes(['MixinConfigs': 'boxy.mixins.json'])
    }
    destinationDirectory = layout.buildDirectory.dir('boxymod')
}
reobf {
    boxyModJar { }
}
tasks.named('boxyModJar') { finalizedBy 'reobfBoxyModJar' }

// Stage the reobf'd standalone mod jar under a non-archive extension (shadow unzips/merges anything
// ending in .jar). BoxyModLocator extracts it to .boxy/cache and hands it to Forge as a ModFile.
tasks.register('stageBoxyModJar', Copy) {
    dependsOn 'reobfBoxyModJar'
    from(tasks.boxyModJar.archiveFile)
    into layout.buildDirectory.dir('generated-boxymod/boxy')
    rename { 'boxy-mod.libzip' }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated-boxymod'))
tasks.named('processResources') { dependsOn 'stageBoxyModJar' }

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier = ''
    // Bundle Mixin Transmogrifier's classes through Shadow (rather than post-reobf) so the `relocate` below
    // can shade them. They reference only modlauncher/mixin/ASM (no Minecraft), so reobf is a no-op on them.
    // These loose classes are vendored under libs/mixintransmog/ (committed — see README.md); the
    // fabric-mixin.jar half is resolved from maven and injected post-reobf by embedMixinUpgrade instead.
    from('libs/mixintransmog')
    // Relocate tiny-remapper so it cannot clash with any other mod that bundles it (e.g. Connector).
    // ASM stays unshaded — Forge provides it on the boot layer.
    relocate 'net.fabricmc.tinyremapper', 'com.golem.boxy.libs.tinyremapper'
    // Shade Mixin Transmogrifier into a Boxy-private namespace. Sinytra Connector bundles it *identically*
    // (loose io.github.steelwoolmc.mixintransmog.* classes in an automatic module), so two un-shaded copies
    // collide as a JPMS split package in the service layer and crash at launch before any Boxy code runs
    // (ModuleLayerHandler.buildLayer — quirk 39). Transmog's own dedup (a Dummy service in onLoad) runs too
    // late to help. Shading is safe: Transmog drives the Mixin upgrade purely by reflection on external
    // modlauncher/Mixin classes, so its own package name is irrelevant; Shadow rewrites the ITransformationService
    // service-file entry to match. Boxy does not register the shaded service directly — BoxyTransmogService
    // wraps it and runs the upgrade only when Connector is absent (the upgrade is NOT idempotent — quirk 40).
    relocate 'io.github.steelwoolmc.mixintransmog', 'com.golem.boxy.libs.mixintransmog'
    // Shade Boxy's stub Fabric API (net.fabricmc.api/loader/fabric.*) into a Boxy-private namespace so the
    // service jar never ships the real net.fabricmc.* packages. Sinytra Connector also provides them; left
    // un-shaded, the two service-layer modules collide as a JPMS split package and the game crashes at launch
    // before any Boxy code runs (ModuleLayerHandler.buildLayer). VoxyRemapper relocates Voxy's references to
    // match (fabricStubRelocation); keep these prefixes in sync with that. NB: net.fabricmc.tinyremapper is a
    // separate prefix relocated above and is unaffected.
    relocate 'net.fabricmc.api', 'com.golem.boxy.fabricapi.api'
    relocate 'net.fabricmc.loader.api', 'com.golem.boxy.fabricapi.loader.api'
    relocate 'net.fabricmc.fabric', 'com.golem.boxy.fabricapi.fabric'
    mergeServiceFiles()
    manifest.inheritFrom tasks.jar.manifest
    // The injected classes (command mod + Chunky mixin) live only inside the bundled voxy-cmd.libzip,
    // not Boxy's own module.
    exclude 'com/golem/boxy/cmd/**'
    exclude 'me/cortex/voxy/commonImpl/mixin/chunky/**'
    // The standalone Boxy mod lives only inside the bundled boxy-mod.libzip, not Boxy's own module.
    exclude 'com/golem/boxy/vss/**'
}

// Reobfuscate the shaded jar (Boxy's own MC-facing classes) to SRG for production.
reobf {
    shadowJar {}
}
tasks.named('shadowJar') { finalizedBy 'reobfShadowJar' }
tasks.named('assemble') { dependsOn 'shadowJar' }

// ---- Bundle the upgraded Mixin (parity with Sinytra Connector) ----
// Forge 1.20.1 ships Mixin 0.8.5, which rejects @Inject @At("INVOKE") into constructors — the pattern
// Voxy's iris.* shader mixins use. Boxy used to rewrite those injects to @At("TAIL") (MixinCtorInjectFix),
// but that reordered Voxy's pipeline build inside IrisRenderingPipeline.<init> and produced shader
// lighting artifacts (a black band under Oculus). Instead, Boxy now bundles **Mixin Transmogrifier +
// Fabric Mixin 0.12.11** and lets Transmog upgrade the runtime Mixin at boot — exactly what Connector
// does — so the iris.* constructor injects apply at their original points (parity with Fabric).
//
// Packaging constraints (mirrors Connector's jar layout, verified against Connector-1.0.0-beta.48):
//   * fabric-mixin.jar must sit at the jar ROOT under that literal name — InstrumentationHack reads it
//     from its own CodeSource location — and must stay a verbatim nested jar (NOT unpacked). So it is
//     injected here, AFTER reobfShadowJar (Shadow would unpack a nested .jar; reobf would needlessly touch it).
//   * The Transmogrifier *classes* are NOT injected here — they go through Shadow (see the shadowJar `from` +
//     `relocate` above) so they get shaded into com.golem.boxy.libs.mixintransmog and don't split-package with
//     Connector (quirk 39). fabric-mixin.jar stays at the root either way, which is all InstrumentationHack needs.
// fabric-mixin.jar is resolved from Sinytra's maven (org.sinytra:sponge-mixin:0.12.11+mixin.0.8.5) via the
// fabricMixinJar configuration. Transmog is activated by listing MixinTransformationService (relocated) in
// the service-layer META-INF/services/...ITransformationService.
tasks.register('embedMixinUpgrade') {
    dependsOn 'reobfShadowJar'
    def fabricMixin = configurations.fabricMixinJar
    inputs.files fabricMixin
    doLast {
        def finalJar = tasks.shadowJar.archiveFile.get().asFile
        // Stage the resolved sponge-mixin artifact under the literal name 'fabric-mixin.jar'. It must sit at
        // the jar ROOT under exactly that name: Transmogrifier's InstrumentationHack loads it by that path
        // relative to its own CodeSource. The maven artifact is named sponge-mixin-<ver>.jar, so copy+rename.
        def stagedMixin = layout.buildDirectory.file('embedMixinUpgrade/fabric-mixin.jar').get().asFile
        stagedMixin.parentFile.mkdirs()
        java.nio.file.Files.copy(fabricMixin.singleFile.toPath(), stagedMixin.toPath(),
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        // META-INF/MANIFEST.MF MUST remain the FIRST entry so securejarhandler reads `Automatic-Module-Name:
        // boxyloader` (the JAR spec puts the manifest first). `ant.zip` does NOT preserve/force that position —
        // it reorders entries, which displaced the manifest and made the module name fall back to the FILENAME
        // `boxy`, colliding with the standalone game-layer mod's `boxy` module (`reads more than one module
        // named boxy` at launch — quirk 20 reintroduced). The Ant *jar* task always writes MANIFEST.MF first,
        // so use it — and feed it the jar's own (correct) manifest verbatim so no attribute is lost.
        def mfDir = layout.buildDirectory.dir('embedMixinUpgrade/mf').get().asFile
        delete(mfDir)
        ant.unzip(src: finalJar, dest: mfDir) {
            patternset { include(name: 'META-INF/MANIFEST.MF') }
        }
        ant.jar(destfile: finalJar, update: true, keepcompression: true,
                manifest: new File(mfDir, 'META-INF/MANIFEST.MF').path) {
            fileset(file: stagedMixin)    // -> /fabric-mixin.jar (verbatim nested jar)
        }
        logger.lifecycle("Boxy: embedded ${fabricMixin.singleFile.name} as fabric-mixin.jar into ${finalJar.name} (manifest kept first; Transmogrifier shaded via shadowJar)")
    }
}
// Run with `./gradlew shadowJar` (the documented build) via the finalizer chain, and with assemble/build.
tasks.named('reobfShadowJar') { finalizedBy 'embedMixinUpgrade' }
tasks.named('assemble') { dependsOn 'embedMixinUpgrade' }

// Publishes the intermediate slim jar to a local file repo. Vestigial MDK scaffolding — the shipped
// artifact is the shaded jar from `./gradlew shadowJar`, not this. Kept only so `publish` stays wired.
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
