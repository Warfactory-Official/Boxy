plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base.archivesName = mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets {
    bootstrap {
        compileClasspath += sourceSets.main.compileClasspath
    }
}
def smokeClientDirectory = providers.gradleProperty('hbm_smoke').isPresent() ? 'run/hbm-smoke' :
        (providers.gradleProperty('downloader_smoke').isPresent() ? 'run/downloader-smoke' :
        (providers.gradleProperty('stability_smoke').isPresent() ? 'run/stability' : 'run/smoke-client'))
def smokeWorldName = providers.gradleProperty('stability_world_source').isPresent() ? 'boxy-stability-snapshot' : 'boxy-migration-smoke'

repositories {
    mavenCentral()
    maven { url = 'https://maven.caffeinemc.net/releases' }
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = neo_version
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
    }
    mods {
        boxy { sourceSet sourceSets.main }
    }
}
neoForge.runs.client.loadedMods.set([neoForge.mods.boxy])
neoForge.runs.server.loadedMods.set([neoForge.mods.boxy])

def voxyJar = providers.gradleProperty('voxy_jar').map { file(it) }
        .orElse(layout.projectDirectory.file('libs/voxy-0.2.15-beta+1.21.1-neoforge.jar').asFile)

configurations {
    nativeClientMods { transitive = false }
}

dependencies {
    // Native Mojmap artifact, supplied separately. Never embed Voxy or renderer libraries in Boxy.
    compileOnly files(voxyJar)
    nativeClientMods files(voxyJar)
    nativeClientMods "maven.modrinth:sodium:${sodium_runtime_version}"
    if (providers.gradleProperty('with_iris').isPresent()) {
        nativeClientMods "maven.modrinth:iris:${iris_version}"
    }
    compileOnly "net.caffeinemc:sodium-neoforge-api:${sodium_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'it.unimi.dsi:fastutil:8.5.12'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Install complete, unmodified native distributions through NeoForge's normal mods-directory discovery.
// Sodium's early service locator is not a game-layer classpath dependency.
tasks.named('jar', Jar) {
    archiveBaseName = 'boxy-core'
    destinationDirectory = layout.buildDirectory.dir('intermediates/core')
    exclude 'META-INF/services/cpw.mods.modlauncher.api.ITransformationService'
    exclude 'com/golem/boxy/bootstrap/**'
}
def coreJarFile = tasks.named('jar', Jar).flatMap { it.archiveFile }

def bootstrapServiceJar = tasks.register('bootstrapServiceJar', Jar) {
    archiveBaseName = 'boxy-bootstrap-service'
    destinationDirectory = layout.buildDirectory.dir('intermediates/bootstrap')
    from sourceSets.bootstrap.output
    manifest {
        attributes 'Automatic-Module-Name': 'com.golem.boxy.bootstrap'
    }
}

def combinedMetadata = layout.buildDirectory.file('generated/combinedJarjar/metadata.json')
def writeCombinedMetadata = tasks.register('writeCombinedJarjarMetadata') {
    dependsOn 'jar'
    outputs.file combinedMetadata
    doLast {
        def metadataFile = combinedMetadata.get().asFile
        metadataFile.parentFile.mkdirs()
        metadataFile.text = """{
  \"jars\": [
    {
      \"identifier\": {
        \"group\": \"com.golem.boxy\",
        \"artifact\": \"boxy-core\"
      },
      \"version\": {
        \"range\": \"[${project.version},)\",
        \"artifactVersion\": \"${project.version}\"
      },
      \"path\": \"META-INF/jarjar/${tasks.jar.archiveFile.get().asFile.name}\",
      \"isObfuscated\": false
    }
  ]
}
"""
    }
}

def bootstrapJar = tasks.register('bootstrapJar', Jar) {
    archiveBaseName = 'boxy'
    from sourceSets.bootstrap.output
    from(coreJarFile) {
        into 'META-INF/jarjar'
    }
    from(writeCombinedMetadata) {
        into 'META-INF/jarjar'
        rename { 'metadata.json' }
    }
}
tasks.named('assemble') { dependsOn bootstrapJar }

tasks.register('stageClientMods', Copy) {
    from configurations.nativeClientMods
    from bootstrapServiceJar
    into 'run/client/mods'
}
tasks.named('runClient') { dependsOn 'stageClientMods' }

tasks.named('compileJava') {
    doFirst {
        if (!voxyJar.get().isFile()) {
            throw new GradleException('Native Voxy 1.21.1 NeoForge jar missing. Set -Pvoxy_jar=<path> or place it in libs/. See README.md.')
        }
    }
}

tasks.named('processResources', ProcessResources) {
    inputs.property 'mod_version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand mod_version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
tasks.withType(AbstractArchiveTask).configureEach {
    includeEmptyDirs = false
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('test') { useJUnitPlatform() }

tasks.register('stageVoxyDependency', Copy) {
    from voxyJar
    into 'libs'
    rename { 'voxy-0.2.15-beta+1.21.1-neoforge.jar' }
}

tasks.register('verifyProductionJar') {
    dependsOn 'jar'
    inputs.file tasks.named('jar').flatMap { it.archiveFile }
    doLast {
        def artifact = tasks.jar.archiveFile.get().asFile
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            ['META-INF/neoforge.mods.toml', 'boxy.mixins.json'].each {
                if (zip.getEntry(it) == null) throw new GradleException("Missing ${it}")
            }
            zip.entries().each { entry ->
                if (entry.name.startsWith('me/cortex/voxy/') || entry.name.startsWith('net/fabricmc/')
                        || entry.name.startsWith('com/golem/boxy/loader/') || entry.name.startsWith('com/golem/boxy/libs/')
                        || entry.name.startsWith('com/golem/boxy/smoke/')
                        || entry.name.startsWith('com/golem/boxy/bootstrap/')
                        || entry.name.startsWith('META-INF/services/')
                        || entry.name.endsWith('.libzip') || entry.name == 'fabric-mixin.jar') {
                    throw new GradleException("Unexpected bundled code: ${entry.name}")
                }
            }
        }
        logger.lifecycle("Verified native addon artifact: ${artifact.name}")
    }
}
tasks.register('verifyBootstrapJar') {
    dependsOn bootstrapJar
    inputs.file bootstrapJar.flatMap { it.archiveFile }
    doLast {
        def artifact = bootstrapJar.get().archiveFile.get().asFile
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            def servicePath = 'META-INF/services/cpw.mods.modlauncher.api.ITransformationService'
            def service = zip.getEntry(servicePath)
            if (service == null) throw new GradleException("Missing ${servicePath}")
            def provider = new String(zip.getInputStream(service).bytes, java.nio.charset.StandardCharsets.UTF_8).trim()
            if (provider != 'com.golem.boxy.bootstrap.EarlyVoxyDownloader') {
                throw new GradleException("Unexpected bootstrap service provider: ${provider}")
            }
            if (zip.getEntry('META-INF/jarjar/metadata.json') == null) {
                throw new GradleException('Missing embedded Boxy Jar-in-Jar metadata')
            }
            def nestedCore = zip.entries().find { it.name.startsWith('META-INF/jarjar/boxy-core-') && it.name.endsWith('.jar') }
            if (nestedCore == null) throw new GradleException('Missing embedded Boxy core jar')
            def nestedNames = []
            new java.util.jar.JarInputStream(zip.getInputStream(nestedCore)).withCloseable { nested ->
                java.util.jar.JarEntry entry
                while ((entry = nested.nextJarEntry) != null) nestedNames << entry.name
            }
            ['META-INF/neoforge.mods.toml', 'boxy.mixins.json'].each {
                if (!nestedNames.contains(it)) throw new GradleException("Embedded core is missing ${it}")
            }
            if (nestedNames.any { it.startsWith('META-INF/services/') || it.startsWith('com/golem/boxy/bootstrap/') }) {
                throw new GradleException('Embedded core contains bootstrap service content')
            }
            ['com/golem/boxy/bootstrap/EarlyVoxyDownloader.class',
             'com/golem/boxy/bootstrap/EarlyVoxyDownloader$Progress.class'].each {
                if (zip.getEntry(it) == null) throw new GradleException("Missing ${it}")
            }
            zip.entries().each { entry ->
                if (entry.name == 'META-INF/neoforge.mods.toml'
                        || entry.name.startsWith('com/golem/boxy/vss/')
                        || entry.name.startsWith('com/golem/boxy/smoke/')
                        || entry.name.startsWith('me/cortex/voxy/')
                        || entry.name.startsWith('net/fabricmc/')) {
                    throw new GradleException("Unexpected bootstrap content: ${entry.name}")
                }
            }
        }
        logger.lifecycle("Verified bootstrap artifact: ${artifact.name}")
    }
}
tasks.named('check') { dependsOn 'verifyProductionJar' }
tasks.named('check') { dependsOn 'verifyBootstrapJar' }

// IDE launches also consume this generated argument file. Tests must never contaminate it.
tasks.register('verifyClientLaunch') {
    dependsOn 'prepareClientRun'
    doLast {
        def arguments = file('build/moddev/clientRunVmArgs.txt').text
        if (arguments.contains('voxy.geometryBufferSizeOverrideMB') || arguments.contains('-Dboxy.smoke')) {
            throw new GradleException('Normal client launch contains smoke-test JVM overrides.')
        }
        if (neoForge.runs.client.loadedMods.get()*.name != ['boxy']) {
            throw new GradleException('Normal client launch must not load the smoke-test mod.')
        }
        logger.lifecycle('Verified normal client launch: native Voxy memory policy, no smoke overrides')
    }
}
tasks.named('check') { dependsOn 'verifyClientLaunch' }

// Opt-in integration mod. Never packaged in Boxy's production artifact.
if (providers.gradleProperty('smoke').isPresent()) {
    sourceSets {
        smoke {
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    neoForge.mods {
        boxy_smoke { sourceSet sourceSets.smoke }
    }
    tasks.register('stageSmokeClientMods', Copy) {
        if (providers.gradleProperty('downloader_smoke').isPresent()) {
            doFirst { delete file("${smokeClientDirectory}/mods") }
        }
        from configurations.nativeClientMods
        from bootstrapServiceJar
        if (providers.gradleProperty('downloader_smoke').isPresent()) {
            exclude { it.file.name.toLowerCase(Locale.ROOT).contains('voxy') }
        }
        if (providers.gradleProperty('hbm_smoke').isPresent()) {
            from file(providers.gradleProperty('hbm_jar').get())
            from file(providers.gradleProperty('golemcore_jar').get())
        }
        into "${smokeClientDirectory}/mods"
    }
    tasks.register('prepareSmokeServer', Copy) {
        onlyIf { !file('run/smoke-server/server.properties').exists() }
        from 'src/smoke/server.properties'
        into 'run/smoke-server'
    }
    tasks.register('validateSmokeWorld') {
        doLast {
            def source = file(providers.gradleProperty('stability_world_source').getOrElse('run/smoke-server/boxy-migration-smoke'))
            if (!file("${smokeClientDirectory}/saves/${smokeWorldName}/level.dat").isFile()
                    && !new File(source, 'level.dat').isFile()) {
                throw new GradleException('Smoke world is missing. Run runSmokeServer -Psmoke first, or provide -Pstability_world_source=<world directory>.')
            }
        }
    }
    tasks.register('prepareClientSmokeWorld', Copy) {
        dependsOn 'validateSmokeWorld'
        onlyIf { !file("${smokeClientDirectory}/saves/${smokeWorldName}/level.dat").exists() }
        from providers.gradleProperty('stability_world_source').orElse('run/smoke-server/boxy-migration-smoke')
        into "${smokeClientDirectory}/saves/${smokeWorldName}"
        exclude 'session.lock'
    }
    neoForge.runs {
        smokeClient {
            client()
            disableIdeRun()
            gameDirectory = file(smokeClientDirectory)
            sourceSet = sourceSets.smoke
            loadedMods.set([neoForge.mods.boxy, neoForge.mods.boxy_smoke])
            // Voxy reserves 256,000,000 free bytes before eviction; 256 MiB total causes constant churn.
            systemProperty 'voxy.geometryBufferSizeOverrideMB', providers.gradleProperty('stability_geometry_mb').orElse('1024').get()
            systemProperty 'boxy.smokeDimensions', providers.gradleProperty('dimension_smoke').isPresent().toString()
            systemProperty 'boxy.smokeHbm', providers.gradleProperty('hbm_smoke').isPresent().toString()
            systemProperty 'boxy.smokeOcclusion', providers.gradleProperty('occlusion_smoke').isPresent().toString()
            systemProperty 'boxy.smokeOcclusionDistance', providers.gradleProperty('occlusion_distance').orElse('160').get()
            systemProperty 'boxy.smokeSkipDepthJoin', providers.gradleProperty('occlusion_control').isPresent().toString()
            systemProperty 'boxy.smokeDepthMode', providers.gradleProperty('occlusion_depth_mode').orElse('PRECISE').get()
            systemProperty 'boxy.smokeStability', providers.gradleProperty('stability_smoke').isPresent().toString()
            systemProperty 'boxy.smokeStabilityControl', providers.gradleProperty('stability_control').isPresent().toString()
            programArguments.addAll('--quickPlaySingleplayer', smokeWorldName)
        }
        smokeServer {
            server()
            disableIdeRun()
            gameDirectory = file('run/smoke-server')
            sourceSet = sourceSets.smoke
            loadedMods.set([neoForge.mods.boxy, neoForge.mods.boxy_smoke])
            programArguments.addAll('--nogui', '--world', 'boxy-migration-smoke')
        }
    }
    tasks.named('runSmokeClient') {
        dependsOn 'prepareClientSmokeWorld', 'stageSmokeClientMods'
        doLast {
            def log = file("${smokeClientDirectory}/logs/latest.log").text
            if (!log.contains('BOXY_CLIENT_SMOKE_OK')) {
                throw new GradleException("Client smoke checks did not complete; inspect ${smokeClientDirectory}/logs/latest.log.")
            }
            if (providers.gradleProperty('downloader_smoke').isPresent()
                    && (!log.contains('(boxy)') || !log.contains('(voxy)'))) {
                throw new GradleException("Downloader smoke did not discover both Boxy and Voxy; inspect ${smokeClientDirectory}/logs/latest.log.")
            }
        }
    }
    tasks.named('runSmokeServer') {
        dependsOn 'prepareSmokeServer'
        doLast {
            if (!file('run/smoke-server/logs/latest.log').text.contains('BOXY_SMOKE_OK')) {
                throw new GradleException('Dedicated-server smoke checks did not complete; inspect run/smoke-server/logs/latest.log.')
            }
        }
    }
}

// Copy a user-supplied reference tree to disposable build output, never modify the original.
tasks.register('stageVoxySource', Sync) {
    def source = providers.gradleProperty('voxy_source')
    doFirst {
        if (!source.isPresent() || !file(source.get()).isDirectory()) {
            throw new GradleException('Specify -Pvoxy_source=<voxy-multiversion source directory>.')
        }
    }
    from(source) {
        exclude '**/.git/**', '**/.gradle/**', '**/.idea/**', '**/build/**', 'voxy-multiversion/**'
    }
    into layout.buildDirectory.dir('voxy-source')
}
